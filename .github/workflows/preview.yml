name: PR page preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview browser
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-tools" --no-package-lock playwright@1.64.1
          "$RUNNER_TEMP/preview-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render desktop and mobile previews
        env:
          NODE_PATH: ${{ runner.temp }}/preview-tools/node_modules
        run: |
          mkdir -p preview
          cp -R site/. preview/
          python3 -m http.server 8000 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/preview-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/room-math.cjs
          node tests/preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview-${{ github.event.pull_request.number || github.run_number }}
          path: preview/
          retention-days: 14
      - name: Preview instructions
        run: |
          echo '### 首页预览' >> "$GITHUB_STEP_SUMMARY"
          echo '下载本次运行的 homepage-preview artifact：desktop.png 和 mobile.png 为页面截图；解压全部文件后运行 python3 -m http.server 8000 可预览网页。' >> "$GITHUB_STEP_SUMMARY"
